pipeline:
  id: pipeline_random_forest_harness_deployment_build_7292
  name: pipeline_random_forest_harness_deployment_build_7292
  stages:
    - name: Build and Test
      id: build_and_test
      runtime: cloud
      platform:
        os: linux
        arch: amd64
      clone:
        enabled: true
      cache:
        enabled: true
      steps:
        - name: Install Dependencies
          id: install_deps
          run:
            shell: bash
            script: |-
              python -m pip install --upgrade pip
              pip install -r requirements.txt
        - name: Run Tests
          id: run_tests
          run:
            shell: bash
            script: |-
              mkdir -p .harness/reports
              pytest --junitxml=.harness/reports/junit.xml
            report:
              type: junit
              paths:
                - .harness/reports/junit.xml
  tags:
    onboarding: "true"
